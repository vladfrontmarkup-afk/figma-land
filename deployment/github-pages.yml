name: Publish website with Figma Land

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the complete personal website
        uses: actions/checkout@v7
        with:
          path: website
          persist-credentials: false

      - name: Check out Figma Land source
        uses: actions/checkout@v7
        with:
          repository: vladfrontmarkup-afk/figma-land
          ref: ${{ vars.FIGMA_LAND_SOURCE_REF || 'feature/sanity-integration' }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install landing page dependencies
        working-directory: source
        run: npm ci

      - name: Test and build published Sanity content
        working-directory: source
        env:
          SANITY_PROJECT_ID: n9ojwqp4
          SANITY_DATASET: production
          SANITY_ENABLED: 'true'
        run: npm run check

      - name: Replace only the Figma Land deployment directory
        shell: bash
        run: |
          set -euo pipefail
          test -f source/dist/index.html
          test "$(realpath website)" = "$GITHUB_WORKSPACE/website"
          mkdir -p website/figma-land
          test "$(realpath website/figma-land)" = "$GITHUB_WORKSPACE/website/figma-land"
          rsync -a --delete source/dist/ website/figma-land/
          touch website/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the complete personal website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
