<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Друга сторінка з окремими стилями та прикладом jQuery.">
    <title>Приклад jQuery — Tailwind Starter</title>
    <script type="module" src="/src/js/demo.js"></script>
  </head>
  <body>
    <main>
      <section class="s-demo" aria-labelledby="demo-title">
        <div class="container">
          <h1 class="s-demo__title" id="demo-title">Друга сторінка</h1>
          <p class="s-demo__description">Ця сторінка має власні CSS і JS. Кнопка нижче збільшує лічильник через jQuery.</p>
          <div data-counter>
            <button class="c-button c-button__primary" type="button" data-counter-button>Додати 1</button>
            <p class="s-demo__result" role="status">Натискань: <span data-counter-value>0</span></p>
          </div>
          <p class="mt-24"><a class="underline text-20" href="./index.html">На головну</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
